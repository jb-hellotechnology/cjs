<perch:form id="reset" method="post" app="perch_members">

	<perch:success>
	  <div class="success">
	    <p>A new password has been emailed to you.</p>
	  </div>
	</perch:success>
		
	<div id="resetform">
		
		<section class="input">
			<perch:label for="email">Enter your email address and we'll send you a new password:</perch:label>
			<perch:input type="text" id="email" required="true" label="Email" placeholder="you@company.com" helper="PerchMembers_Members::check_email_exists" />
			<perch:error for="email" type="required">Please add your email address</perch:error>
			<perch:error for="email" type="helper"><p>We don't have an account with that email address.</p></perch:error>
		</section>
		
		<section class="input">
		  <perch:input type="submit" value="Reset" />
		</section>
	
	</div>

</perch:form>
