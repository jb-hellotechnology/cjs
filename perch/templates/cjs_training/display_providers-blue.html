<perch:before>

</perch:before>	

<perch:if exists="providerName">
	<section class="listing blue <perch:if id="displayAd" value="1" match="eq">displayad</perch:if>">
	  <p class="listing-title">
	    <strong>
	      <perch:cjs id="providerName">
	    </strong>
	  </p>
	  <perch:if exists="logo"><img src="<perch:cjs id="logo" />" alt="<perch:cjs id="logoAlt" />" /></perch:if>
	  <perch:cjs id="description" html />
	  <p><perch:if exists="advertEmail"><a href="mailto:<perch:cjs id="advertEmail" />?subject=<perch:cjs id="providerName"> advertised in CJS Training Directory" /><perch:cjs id="advertEmail" /></a> <perch:if exists="advertWebsite"><a href="<perch:cjs id="advertWebsite" />" target="_blank"><perch:cjs id="advertWebsite" replace="http://|,https://|" /></a> </perch:if></perch:if><perch:cjs id="advertTelephone" /></p>
	</section>
</perch:if>

<perch:after>

</perch:after>
