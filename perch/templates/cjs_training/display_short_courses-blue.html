<perch:before>

</perch:before>

<perch:if exists="shortTitle">
<section class="listing blue <perch:if exists="displayAd">displayad</perch:if>">
  <p class="listing-title">
    <perch:if id="startDate" value="0000-00-00" match="neq"><perch:cjs id="startDate" format="d/m/Y" /></perch:if>
    <perch:if id="startDate" value="0000-00-00" match="eq">Various</perch:if>
    <strong>
        <a href="/training/<perch:cjs id="sector" />#sc_<perch:cjs id="shortID" />"><perch:cjs id="shortTitle"></a>
    </strong>
  <perch:if exists="numberDays">
    <perch:cjs id="numberDays" /> <perch:if id="numberDays" match="gt" value="1">Days<perch:else>Day</perch:if>
  </perch:if>
  </p>
   <perch:if exists="logo">
    <img src="<perch:cjs id="logo" />" alt="<perch:cjs id="shortTitle">" />
  </perch:if>
  <p>
    <perch:cjs id="location"  />, <perch:cjs id="provider" /> <!--<perch:cjs id="advertTelephone" />  <perch:if exists="advertEmail"><a href="mailto:<perch:cjs id="advertEmail" />?subject=<perch:cjs id="shortTitle" /> advertised in CJS Training Directory"><perch:cjs id="advertEmail" /></a></perch:if> <perch:if id="advertLink" match="eq" value="1"><a href="<perch:cjs id="advertWebsiteShort" />" target="_blank"><perch:cjs id="advertWebsiteShort" replace="http://|,https://|" /></a><perch:else /><a href="<perch:cjs id="advertWebsite" />" target="_blank"><perch:cjs id="advertWebsite" replace="http://|,https://|" /></a></perch:if>-->
  </p>
  <perch:cjs id="description" html />
  <perch:if id="courseCost" match="gt" value="0.00">
    <p>
      Cost &pound;<perch:cjs id="courseCost" />
    </p>
  <perch:else />
  	<perch:if id="freeCourse" match="eq" value="1">
	  	<p>Free Course</p>
  	</perch:if>
  </perch:if>
</section>
</perch:if>

<perch:after>

</perch:after>
