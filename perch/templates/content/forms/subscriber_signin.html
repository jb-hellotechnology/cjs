<perch:form id="subscriber_signin" method="post" app="cjs_subscribers" role="form" action="/restricted_access/cjsweekly">
	
	<section class="input">
		<perch:label for="name">Username:</perch:label>
		<perch:input type="text" id="username" label="Username" required="true" />
	</section>
	<section class="input">
		<perch:label for="password">Password:</perch:label>
		<perch:input type="password" id="password" label="Password" required="true" />
	</section>
	<section class="input">
		<perch:input type="submit" value="Sign In" />
	</section>
	
</perch:form>
