<perch:form id="delete_account" method="post" app="perch_forms" role="form">
  
  <p>
    <strong>No longer need your CJS account?</strong>
  </p>
	<section class="input">
		<p>For security, please confirm your Member ID:</p>
		<perch:input type="text" id="memberID" label="Member ID" />
	</section>
	<section class="input">
		<p>And confirm your email address:</p>
		<perch:input type="text" id="email" label="Email Address" />
	</section>
	<section class="input">
		<perch:input type="submit" value="Please Delete My Account" />
	</section>
  
  <perch:success>
    <div class="success">
      <p>We have received your request and will delete your account shortly</p>
    </div>
  </perch:success>
	
</perch:form>
