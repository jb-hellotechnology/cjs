<perch:form id="contact_cjs" method="post" app="perch_forms" role="form">
  
  <p>
    <strong>Enter your enquiry in the space provided below, please send as much detail as possible then we will be able to provide you with the best answer.</strong>
  </p>
  <section class="input">
    <perch:input type="textarea" id="message" label="Message" required="true" />
  </section>
  <p>
    <strong>Tell us how to get in touch with you:</strong>
  </p>
	<section class="input">
		<perch:label for="name">Name: <span>*</span></perch:label>
		<perch:input type="text" id="name" label="Name" required="true" />
	</section>
  <section class="input">
		<perch:label for="email">Email: <span>*</span></perch:label>
		<perch:input type="text" id="email" label="Email Address" required="true" />
	</section>
	<section class="input">
		<perch:label for="telephone">Telephone: <span>*</span></perch:label>
		<perch:input type="text" id="telephone" label="Telephone" required="true" />
	</section>
  <section class="input">
		<perch:label for="telephone">CJS Number (if known):</perch:label>
		<perch:input type="text" id="cjs_number" label="CJS Number" />
	</section>
  <section class="input other">
    <label>Are you human? If so, don't write in here.</label>
    <perch:input type="text" id="enquiry" antispam="honeypot" />
  </section>
  <section class="input">
	  <div class="g-recaptcha" data-sitekey="6LcKQNYfAAAAAKfvMMYcA6xI8d64c0oxSbIpoSuB" data-callback="enableBtn"></div>
  </section>
	<section class="input">
		<perch:input type="submit" value="Send Message" disabled="disabled" id="submit" />
	</section>
  
  <perch:success>
    <div class="success">
      <perch:content type="textarea" id="confirmation" label="Confirmation Message" html editor="redactor" />
    </div>
  </perch:success>
  
  <p>
    <span>*</span> = required field
  </p>
	
</perch:form>

<script>
function enableBtn(){
   document.getElementById("form1_submit").disabled = false;
 }	
</script>
