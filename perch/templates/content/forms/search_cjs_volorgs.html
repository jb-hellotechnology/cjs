<perch:form method="get" role="form" action="/volunteers/volunteering-organisations/results" id="form">
	<h2>Search Our Volunteer Organisations</h2>
	<section class="input">
    	<perch:label>Region</perch:label>
		<perch:input type="select" id="region" options="Please Select|, East Anglia, Midlands, North East, North West, South, South West, Scotland, Wales, Northern Ireland, National, International" />
	</section>
	<section class="input">
    	<perch:label>Type of Volunteering Offers</perch:label>
		<perch:input type="select" id="type" options="Placements, Occasional Requirement, Work Days, Citizen Science" />
	</section>
	<section class="input">
		<perch:input type="submit" value="Search" />
	</section>
</perch:form>
