<!-- THIS IS THE OPENING FORM TAG -->
<!-- The id is a unique 'name' for the form, every form needs a different one, it's how Perch recognises which form is being submitted. The 'app' is the app which will process the submission, for a standard form that'll always be perch_forms -->
<perch:form id="cjs_demo_form" method="post" app="perch_forms" role="form">
  
  <!-- Here you can build your form field - or include any standard HTML you like, like this: -->
  <p><strong>Reader Survey test 1</strong></p>
  
  <!-- Here is an example of all the main inputs you might need to use, they're all wrapped in a section, so they get displayed correctly on the website. -->
  <!-- Note that the fields don't have a name - the name is generated by Perch using the id, and the label is used within Perch when displaying the submitted data. -->
  <!-- Only Perch will see the id, so it can be anything, but a person will see Label, so it should be human-readable -->
  <section class="input">
    <perch:label>Name: <span>*</span></perch:label>
    <perch:input type="text" id="fieldname_name" label="Name" placeholder="name" required />
  </section>
  
  <section class="input">
    <perch:label>Post Code: <span>*</span></perch:label>
    <perch:input type="text" id="fieldname_post-code" label="Post Code" required />
  </section>

<section class="input">
    <perch:label>Your CJS Number or online username <span>*</span></perch:label>
    <perch:input type="text" id="fieldname_CJSNo" label="CJS Number" placeholder="Your CJS number or username" required />
  </section>

<section class="input">
    <perch:label>Email <span>*</span></perch:label>
    <perch:input type="text" id="fieldname_email" label="email" required />
  </section>

  
  <section class="input">
	  <paerch:label>Textarea Field</paerch:label>
	  <perch:input type="textarea" id="fieldname_textarea" label="Textarea" placeholder="Put any placeholder info here" />
  </section>
  
  <section class="input">
    <perch:label>File Field</perch:label>
    <perch:input type="file" id="fieldname_file" label="File" />
  </section>
  
  <section class="input">
    <perch:label><perch:input type="checkbox" id="fieldname_checkbox" value="true" label="Checkbox" /> Checkbox Field</perch:label>
  </section>
  
  <section class="input">
	  <!-- Note the options are comma seperated -->
	  <perch:input id="fieldname_radio" type="radio" options="Option 1,Option 2,Option 3" wrap="label">
  </section>
  
  <section class="input">
    <perch:label>Select Field</perch:label>
    <!-- Note the options are comma seperated -->
    <perch:input type="select" id="fieldname_select" options=",Phone,Email" label="Select Field" />
  </section>

  <!-- End with a Submit button -->
  <section class="input">
	<perch:input type="submit" value="Submit Advert" />
  </section>
  
  <!-- This gets displayed after the form is submitted - it's a Perch region you can edit within the CMS once you've added the form to a page -->
  <perch:success>
    <div class="success">
      <perch:content type="textarea" id="confirmation" label="Confirmation Message" html editor="redactor" />
    </div>
  </perch:success>
  
  <p><span>*</span> = required field</p>
	
</perch:form>
