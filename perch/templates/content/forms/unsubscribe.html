<perch:form id="unsubscribe" method="post" app="perch_forms" role="form">
  <section class="input">
		<perch:label for="email">Email: <span>*</span></perch:label>
		<perch:input type="text" id="email" label="Email Address" required="true" />
	</section>
  <section class="input">
		<perch:label for="message">Any comments for CJS:</perch:label>
		<perch:input type="text" id="message" label="Message" />
	</section>
  <section class="input other">
    <perch:label for="enquiry">Are you human? If so, don't write in here.</perch:label>
    <perch:input type="text" id="enquiry" antispam="honeypot" />
  </section>
	<section class="input">
		<perch:input type="submit" value="Submit" />
	</section>
  
  <perch:success>
    <div class="success">
      <perch:content type="textarea" id="confirmation" label="Confirmation Message" html editor="redactor" />
    </div>
  </perch:success>
  
  <p>
    <span>*</span> = required field
  </p>
	
</perch:form>
