<perch:form id="Advertiser-mailing-confirm" method="post" app="perch_forms" role="form">
  
  <!-- Here you can build your form field - or include any standard HTML you like, like this: -->
  
  <!-- Here is an example of all the main inputs you might need to use, they're all wrapped in a section, so they get displayed correctly on the website. -->
  <!-- Note that the fields don't have a name - the name is generated by Perch using the id, and the label is used within Perch when displaying the submitted data. -->
  <!-- Only Perch will see the id, so it can be anything, but a person will see Label, so it should be human-readable -->
  <section class="input">
    <perch:label>Name: <span>*</span></perch:label>
    <perch:input type="text" id="fieldname_name" label="Name" placeholder="name" required />
  </section>

<section class="input">
    <perch:label>Email address, the one we originally contacted you on * </perch:label>
    <perch:input type="text" id="fieldname_email" label="email" placeholder="email" required />
  </section>

<section class="input">
    <perch:label>Email to send future mailing to if different from above </perch:label>
    <perch:input type="text" id="fieldname_newemail" label="newemail" placeholder="alternate email" />
  </section>
  
  <section class="input">
    <perch:label>Organisation * </perch:label>
    <perch:input type="text" id="fieldname_org" label="organisation" placeholder="organisation" required />
  </section>


  <section class="input">
   <perch:label>Please confirm you would like to remain on the advertisers mailing list* </perch:label>
	  <!-- Note the options are comma seperated -->
	  <perch:input id="fieldname_confirm" type="radio" options="Yes,No " wrap="label" label="confirm" required>
  </section>


  
  <section class="input">
	  <perch:label>Any comment or message for the CJS Team</perch:label>
	  <perch:input type="textarea" id="fieldname_message" label="Message" placeholder="Message...." />
  </section>
  
  
 
  <!-- End with a Submit button -->
  <section class="input">
	<perch:input type="submit" value="Submit" />
  </section>
  
  <!-- This gets displayed after the form is submitted - it's a Perch region you can edit within the CMS once you've added the form to a page -->
  <perch:success>
    <div class="success">
      <perch:content type="textarea" id="confirmation" label="Confirmation Message" html editor="redactor" />
    </div>
  </perch:success>
  
  <p><span>*</span> = required field</p>
	
</perch:form>
