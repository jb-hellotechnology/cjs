<perch:blog id="postDateTime" label="Post Publish Date" type="date" time="true" format="%d %B %Y" suppress="true" />
<article class="h-entry">
	<h2 class="headline"><a href="<perch:blog id="postLink" type="text" label="Link" />" target="_blank"><perch:blog id="postTitle" type="text" label="Title" required="true" size="xl autowidth" order="1" /></a> - <perch:blog id="postSource" type="text" label="Source" /></h2>
  <perch:blocks>
    <perch:block type="textImage" label="Text with Image">
      <section class="text-image">   
        <perch:blog type="textarea" id="post" label="Post" html editor="redactor" /> 
      </section>
    </perch:block>
  </perch:blocks>
</article>
<style>article.h-entry img{display:none;}</style>
